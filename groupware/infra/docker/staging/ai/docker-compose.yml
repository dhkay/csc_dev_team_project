# video-ai-server staging 스택: 미디어 파이프라인의 컴퓨트측(무상태 worker).
# self-hosted 러너(video-ai-server)가 scripts/deploy/deploy.sh 로 빌드/기동한다.
#
# 다이어그램(file-storage-architecture)대로 video-ai-server 는 무상태 컴퓨트 존이다:
#   - video-model(API), video_jobs DB, redis 는 web-server(csc-staging-web) 에 있다.
#   - 여기서는 worker 만 돌리고, web-server 의 redis/file-service/video-model 에 LAN 으로 접속한다.
#   - DB/디스크 없음. 무거운 처리(ffmpeg/AI)만 수행.
#
# 자원 공유(web-server 와 다른 정책): video-ai-server 는 무상태이므로 staging 과 prod 가 "같은 하드웨어"를
#   공유한다. 단 별도 compose 프로젝트(csc-staging-ai / csc-prod-ai), 별도 컨테이너, 별도 이미지,
#   별도 web-server 엔드포인트(staging redis 6379 / prod 6380)로 분리되어 나란히 돈다.
#   staging 은 best-effort 로 자원을 캡해 prod(우선)에 주는 영향을 최소화한다:
#     - cpu_shares 낮게(경합 시 prod 에 양보) + cpus 하드 상한 + mem_limit 작게 + WORKER_MAX_JOBS 낮게.
# 변수는 이 디렉터리의 .env(없으면 기본값)에서 읽는다. web-server LAN IP 는 WEB_SERVER_HOST 로 지정.
name: csc-staging-ai

services:
  video-model-worker:
    build:
      context: ../../../../apps/api/fastapi
      dockerfile: video-model/Dockerfile
    image: csc/api-video-model:staging
    container_name: csc-staging-video-model-worker
    environment:
      # 큐/파일/콜백 대상 = web-server(csc-staging-web) LAN. staging redis 호스트 포트 6379.
      REDIS_URL: redis://:${REDIS_PASSWORD:-csc}@${WEB_SERVER_HOST:-192.168.0.26}:6379/2
      FILE_SERVICE_URL: http://${WEB_SERVER_HOST:-192.168.0.26}:8001
      VIDEO_SERVICE_URL: http://${WEB_SERVER_HOST:-192.168.0.26}:8002
      # 서버 간 인증(Layer 3): 전 서버 동일 값. worker 신원=video-model.
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?set SERVICE_TOKEN_SECRET in server .env}
      # 조직 자격증명(잡 params) 복호화 전용 키(선택): csc-marketing(web 스택)의 JOB_CREDENTIAL_ENC_KEY 와 동일 값이어야 한다.
      #   미설정이면 SERVICE_TOKEN_SECRET 로 폴백(양쪽 동일 유도라 복호화 일치).
      JOB_CREDENTIAL_ENC_KEY: ${JOB_CREDENTIAL_ENC_KEY:-}
      WORKER_SERVICE_NAME: video-model
      # ffmpeg/미디어 컴퓨트 동시성: staging 은 낮게(공유 하드웨어에서 prod 우선).env 로 오버라이드.
      # LLM 호출(GENERATE/AI) 동시성은 이 값, 아래 cpu/mem 캡과 무관: 전용 세마포어로 별도 제한.
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-2}
      # 자체 영상 생성(Wan 2.2 TI2V-5B I2V): ComfyUI(GPU, 아래)에 HTTP 위임. csc-ai 네트워크로 접근(호스트 hairpin 회피).
      #   I2V 워크플로는 video-model 이미지에 번들(코드) → 호스트 마운트 불요.
      COMFYUI_URL: http://csc-ai-comfyui:8188
      # 외부 영상 벤더 한도(vendor_http.VendorThrottle): 키(조직 프로젝트)별 분당 제출 상한과 429 백오프 횟수.
      #   한도의 1차 출처는 조직이 API 키와 함께 등록한 값(자격증명 필드 submitsPerMinute)이고, 이 env 는
      #   그 값이 없는 키에만 쓰이는 기본값이다.
      #   staging 과 prod 가 같은 조직 키를 쓰면 벤더는 둘을 합산하므로 staging 은 더 낮게 잡는 것이 안전하다.
      #   0 은 간격 조절 없음(백오프만).
      GEMINI_SUBMITS_PER_MINUTE: ${GEMINI_SUBMITS_PER_MINUTE:-2}
      GEMINI_THROTTLE_MAX_RETRIES: ${GEMINI_THROTTLE_MAX_RETRIES:-4}
      HIGGSFIELD_SUBMITS_PER_MINUTE: ${HIGGSFIELD_SUBMITS_PER_MINUTE:-0}
      XAI_SUBMITS_PER_MINUTE: ${XAI_SUBMITS_PER_MINUTE:-0}
      # 병렬(빠른 생성)에서 한 잡이 동시에 생성 중인 씬 수 상한. 제출 간격은 위 값이 벌린다.
      COMPOSE_SEGMENT_PARALLELISM: ${COMPOSE_SEGMENT_PARALLELISM:-3}
    # 자원 정책(공유 하드웨어에서 staging=best-effort): ffmpeg/미디어 CPU, 메모리 대상.
    # LLM 은 네트워크 I/O 라 이 캡의 대상이 아니다(별도 동시성 제한).
    # docker compose up(비-swarm) 적용 레거시 키:
    #   - cpu_shares 낮게(경합 시 prod 에 양보) + cpus 하드 상한 + mem_limit 작게.
    cpu_shares: ${WORKER_CPU_SHARES:-256}
    cpus: ${WORKER_CPUS:-1.5}
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    networks: [default, csc-ai]
    command: ["arq", "app.worker.WorkerSettings"]
    # arq 내장 health-check(하트비트 키 신선도): restart 는 *크래시*만, hung(소비 정지) 워커는 이걸로 드러난다.
    #   비-swarm compose 는 unhealthy 자동 재시작 안 함 → 모니터링/autoheal 이 조치(design-external-video-models.md).
    healthcheck:
      test: ["CMD", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # LLM 추론(csc-ai-vllm)은 web-server 로 이전됨(staging/web). video-ai-server GPU 는 아래 ComfyUI(영상) 전용.

  # 자체 영상 생성(Wan 2.2 TI2V-5B I2V): ComfyUI(GPU). video-model-worker 가 csc-ai 네트워크로 :8188 에 HTTP 제출.
  #   구 vLLM 자리(video-ai-server GPU). 공유 싱글톤: staging/ai 소유, prod/ai worker 도 csc-ai 로 공유.
  #   모델/워크플로/출력은 호스트 볼륨($COMFYUI_DIR). ComfyUI 코어가 Wan 2.2 네이티브 지원(커스텀노드 불요).
  comfyui:
    build:
      context: ../../comfyui
      dockerfile: Dockerfile
    image: csc/comfyui:staging
    container_name: csc-ai-comfyui
    volumes:
      - ${COMFYUI_DIR:-/home/escoa1/comfyui}/models:/opt/ComfyUI/models
      - ${COMFYUI_DIR:-/home/escoa1/comfyui}/custom_nodes:/opt/ComfyUI/custom_nodes
      - ${COMFYUI_DIR:-/home/escoa1/comfyui}/output:/opt/ComfyUI/output
      - ${COMFYUI_DIR:-/home/escoa1/comfyui}/input:/opt/ComfyUI/input
      - ${COMFYUI_DIR:-/home/escoa1/comfyui}/user:/opt/ComfyUI/user
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 호스트 포트는 로컬/터널 디버그용(127.0.0.1). 같은 호스트의 워커는 csc-ai 네트워크로 접근한다.
    #   LAN 소비자(개발 PC, web-server 의 language-model)는 도커 publish 가 아니라 socat 포워더로 받는다:
    #   도커 published 포트는 ufw INPUT 을 우회해 출처를 좁힐 수 없기 때문이다. 소비자별 유닛으로 분리:
    #     8188 ← 개발 PC(192.168.0.157)   comfyui-lan-forward.service
    #     8189 ← web-server(192.168.0.26) comfyui-web-forward.service
    #   상세/명령은 infra/docker/README.md 보안 절 참고.
    ports:
      - "127.0.0.1:8188:8188"
    networks: [default, csc-ai]
    restart: unless-stopped

  # 호스트 시스템 지표(CPU/GPU/VRAM/RAM) 수집 에이전트: 서버 모니터링 대시보드(ai 호스트, GPU).
  #   vllm 과 동일한 nvidia 런타임으로 libnvidia-ml 주입(pynvml). control-tower 가 LAN:8091 로 호출.
  #   staging 은 prod 와 ai 호스트 공유 → 포트 8091(prod 8090)로 분리. ufw 로 web-server IP 만 허용.
  metrics-agent:
    build:
      context: ../../../../apps/api/fastapi
      dockerfile: metrics-agent/Dockerfile
    image: csc/api-metrics-agent:staging
    container_name: csc-staging-ai-metrics-agent
    pid: "host"
    environment:
      APP_ENV: staging
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?set SERVICE_TOKEN_SECRET in server .env}
      # 포털(scalar-gateway)은 web 호스트에 있어 LAN 너머 이 인스턴스에 도달하지 못한다.
      # 따라서 config 기본값(csc-control-tower,scalar-gateway)보다 좁게 유지한다.
      ALLOWED_SERVICES: csc-control-tower
      HOST_ID: staging-ai
      HOST_LABEL: "AI Server (staging)"
      HOST_ROLE: ai
      HOST_PROC: /host/proc
      DISK_PATH: /host/root
      HOST_SYS: /host/sys
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${METRICS_AGENT_PORT:-8091}:8000"
    restart: unless-stopped

networks:
  # 기본(staging/ai) 네트워크.
  default:
  # ComfyUI(csc-ai-comfyui) 접근용 외부 네트워크: video-ai-server 에서 미리 생성(docker network create csc-ai).
  csc-ai:
    external: true
    name: csc-ai
