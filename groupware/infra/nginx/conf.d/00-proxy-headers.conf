# 업스트림 응답 헤더 버퍼 (http 컨텍스트)
# conf.d/*.conf 는 nginx 기본 nginx.conf 의 http{} 안에 include 되므로 여기서 정의한다.
# 파일명 00- 접두사 → vhost conf 보다 먼저 로드(값 자체는 상속이라 순서 무관, 규칙만 맞춘다).
#
# 왜 필요한가: SvelteKit(adapter-node)은 페이지 SSR 응답에 그 라우트가 필요한 청크 전부를
#   `Link: <...>; rel="modulepreload"` / `rel="preload"` 로 실어 보낸다. 라우트가 무거워질수록
#   이 헤더가 커진다. 실측(prod): /login 은 2.8KB, /[orgSlug]/[toolSlug]/[channelSlug]
#   (마케팅영상 워크스페이스)는 css 3 + js 59 개로 link 헤더 단독 4.1KB.
#
# nginx 는 업스트림 응답 헤더 전체가 proxy_buffer_size 버퍼 하나에 들어가야 하며 기본값이 4k 다.
#   넘으면 "upstream sent too big header while reading response header from upstream" 을 남기고
#   응답을 버려 502 를 내보낸다. 이때 죽는 건 SSR(새로고침/URL 직접진입)뿐이고 클라이언트
#   네비게이션(=JSON 데이터 요청)은 살아 있어서, 증상이 "들어가는 건 되는데 새로고침하면 502" 로
#   보이며 원인이 라우팅 문제처럼 오인된다.
#
# 라우트가 더 커질 여지를 두고 헤더 버퍼를 32k(기본의 8배)로 잡는다.
#   proxy_buffers/busy 는 헤더 때문이 아니라 nginx 제약을 맞추려고 함께 올린다:
#   busy >= proxy_buffer_size 이고 busy <= (전체 버퍼 - 한 버퍼) 여야 해서, 기본값(8 4k = 32k)으로는
#   32k 헤더 버퍼와 공존할 수 없다. 그래서 최소 조합(4 32k / 32k)만 쓴다. 응답 하나가 점유하는
#   상한을 필요 이상으로 키우지 않는다. proxy_buffering off 경로(/files 스트리밍)도 헤더엔 이 값이 적용된다.
proxy_buffer_size       32k;
proxy_buffers           4 32k;
proxy_busy_buffers_size 32k;
