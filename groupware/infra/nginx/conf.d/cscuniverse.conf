# cscuniverse.com: prod groupware 프론트 외부 노출.
#   - web-server 자체 호스팅 (Cloudflare 미사용).
#   - TLS: Let's Encrypt (HTTP-01, certbot 자동발급/갱신).
#   - 접근 제한: 허용 IP 외 전부 403. 단 ACME 검증 경로만 전세계 공개.
#
# upstream(web-groupware)은 같은 compose 네트워크의 서비스명으로 해석된다.

server_tokens off;   # 응답에서 nginx 버전 숨김

# HTTP(80): ACME 검증 + HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name cscuniverse.com www.cscuniverse.com;

    # Let's Encrypt HTTP-01 검증: 전세계 공개(IP 제한 없음).
    # certbot 이 토큰을 이 webroot 에 쓰고, LE 검증 서버가 여기로 접근한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 그 외 전부 HTTPS 로.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443): 실제 서비스
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cscuniverse.com www.cscuniverse.com;

    ssl_certificate     /etc/letsencrypt/live/cscuniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cscuniverse.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HTTPS 강제(HSTS). 모든 트래픽이 이미 HTTPS 이고 인증서 자동갱신됨.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 접근(access): 전세계 공개(PUBLIC) groupware 사용자 웹이라 공개한다.
    #   사무실 IP 전용으로 되돌리려면 아래 include 주석을 해제(한 줄 토글).
    #   allowlist 실파일은 repo 에 두지 않고 서버 전용 파일로 관리(gitignore): snippets/cscuniverse-allow.conf
    # include /etc/nginx/snippets/cscuniverse-allow.conf;

    # 기본 본문 한도(BFF 는 JSON 메타데이터만) → 작게. 업로드(/blob)만 아래에서 상향.
    client_max_body_size 10m;

    # 파일 업로드/다운로드 (file-upload 서비스): server 블록의 접근 정책 상속(현재 PUBLIC)
    # 브라우저가 file-upload 로 직접 PUT/GET(BFF 우회). PUT 은 서명 업로드토큰으로 보호,
    # GET(/files)은 UUID 로 주소지정되는 공개 자산. 대용량 → body limit 상향.
    location = /blob {
        limit_req zone=upload_limit burst=20 nodelay;   # 업로드 남용/DoS 방어(서명 업로드토큰과 이중)
        # 스토리지 화면 상한(200MB)보다 크게 잡는다. 서버가 그 값을 presign 에서 이미 거절하므로
        #   여기 한도는 그 검사를 통과한 요청이 nginx 에서 다시 막히지 않게 하는 여유일 뿐이다.
        client_max_body_size 210m;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $fileupload_upstream api-file-service:8000;
        proxy_pass http://$fileupload_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 브라우저가 file-upload 로 직접 GET(다운로드/영상 재생).
    location /files/ {
        proxy_buffering off;   # 대용량 영상 스트리밍, Range(206) 즉시 전달
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $fileupload_upstream api-file-service:8000;
        proxy_pass http://$fileupload_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 스토리지 파일 읽기 (web BFF 경유)
    # /f/ 는 공통 파일의 공개 주소다(로그인 없이 열린다. file-upload-limits.md 참고).
    #   조직/개인 파일은 /api/storage/ 아래에서 세션을 확인한 뒤에만 바이트가 나간다.
    #   두 경로 모두 바이트를 내주므로 남용 비용이 커서 레이트리밋을 건다. 인가는 앱이 하고
    #   여기는 빈도만 본다(이중 방어: 앱이 막는 것과 nginx 가 막는 것이 다른 종류다).
    location /f/ {
        limit_req zone=file_limit burst=120 nodelay;
        proxy_buffering off;   # 대용량 파일 스트리밍, Range(206) 즉시 전달
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $groupware_public_file web-groupware:3000;
        proxy_pass http://$groupware_public_file;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /api/storage/ {
        limit_req zone=file_limit burst=120 nodelay;
        proxy_buffering off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $groupware_storage web-groupware:3000;
        proxy_pass http://$groupware_storage;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # 로그인/인증(BFF /api/auth/*): 공개 apex 라 브루트포스/크리덴셜 스터핑 방어(레이트리밋).
    #   프록시는 location / 과 동일(web-groupware BFF): 레이트리밋만 추가한다. 앱 레벨 계정 잠금과 이중.
    location /api/auth/ {
        limit_req zone=auth_limit burst=60 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $groupware_auth_upstream web-groupware:3000;
        proxy_pass http://$groupware_auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # AI 생성(기획안 텍스트 / 씬 이미지): 유일하게 느린 경로라 여기만 길게 허용한다.
    #   nginx 기본 proxy_read_timeout 은 60s 인데, 이 요청들은 그보다 오래 걸릴 수 있다:
    #     - 기획안 생성: 논스트리밍 단일 호출(수십 초). 응답 전까지 바이트가 없어 60s 타이머를 리셋할 게 없다.
    #     - 씬 이미지: 공유 ComfyUI(GPU 1장, staging/prod/dev 공용) 큐에서 차례를 기다린다.
    #   사다리: 여기(360s) > csc-marketing(300s) > language-model(240s). 아래층이 먼저 끊겨야
    #   원인이 그 층의 언어로 보고된다. 실측: 기획안 5개x씬 6개 = 118s(Claude).
    #   여기가 60s 로 먼저 끊으면 그 조율이 전부 무의미해지고, 작업자는 504 를 본다.
    #   나머지 경로는 기본 60s 유지: 느려도 되는 건 AI 생성뿐이다.
    location /api/marketing/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $groupware_ai_upstream web-groupware:3000;
        proxy_pass http://$groupware_ai_upstream;
        proxy_http_version 1.1;

        proxy_read_timeout 360s;
        proxy_send_timeout 360s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        # 도커 임베디드 DNS 로 런타임 재해석(변수 사용) → 배포로 web-groupware 컨테이너가
        # 재생성돼 IP 가 바뀌어도 nginx 재시작 없이 따라간다.
        # (static proxy_pass 는 시작 시 1회만 IP 해석 → 재배포 후 옛 IP 로 가서 404 나던 버그)
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $groupware_upstream web-groupware:3000;
        proxy_pass http://$groupware_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# admin.cscuniverse.com: prod 플랫폼 관리자(control-tower) 외부 노출
#   - 동일 nginx, 동일 인증서(cscuniverse.com 인증서 SAN 에 admin.cscuniverse.com 포함).
#   - 접근제한은 apex 와 동일 allowlist(사무실만). 브라우저 직접 업로드(/blob,/files)는
#     PUBLIC_UPLOAD_BASE_URL(=cscuniverse.com)로 가므로 admin vhost 에선 라우팅 불필요.
server {
    listen 80;
    listen [::]:80;
    server_name admin.cscuniverse.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.cscuniverse.com;

    ssl_certificate     /etc/letsencrypt/live/cscuniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cscuniverse.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 접근(access): 사무실 공인 IP 전용(RESTRICTED) 관리자 패널이라 공개하지 않는다.
    #   공개하려면 아래 include 를 주석 처리(한 줄 토글).
    include /etc/nginx/snippets/cscuniverse-allow.conf;

    client_max_body_size 10m;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $controltower_upstream web-control-tower:3000;
        proxy_pass http://$controltower_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# api-docs.cscuniverse.com: prod 통합 API 문서 포털(scalar-gateway) 외부 노출
#   - 동일 nginx, 동일 인증서(cscuniverse.com 인증서 SAN 에 api-docs.cscuniverse.com 추가 필요).
#     → certbot 도메인 목록(init-letsencrypt.sh / renew)에 api-docs.cscuniverse.com 포함.
#   - 보호: 이 server 블록의 IP allowlist(사무실만) + scalar-gateway 앱 레벨 BasicAuth(SWAGGER_USER/PASSWORD) 이중.
server {
    listen 80;
    listen [::]:80;
    server_name api-docs.cscuniverse.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-docs.cscuniverse.com;

    ssl_certificate     /etc/letsencrypt/live/cscuniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cscuniverse.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 접근(access): 사무실 공인 IP 전용(RESTRICTED) API 문서 포털(IP + BasicAuth 이중). 공개하지 않는다.
    #   공개하려면 아래 include 를 주석 처리(한 줄 토글).
    include /etc/nginx/snippets/cscuniverse-allow.conf;

    client_max_body_size 10m;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        # 두 네트워크(prod/staging)에 동명 서비스가 있어 prod 컨테이너명으로 명시 해석.
        set $apidocs_upstream csc-prod-scalar-gateway:3000;
        proxy_pass http://$apidocs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
