# staging.cscuniverse.com: staging groupware 프론트 외부 노출.
#   - prod nginx 가 staging 네트워크(csc-staging-web_default)에 연결되어 staging 컨테이너로 프록시.
#   - TLS: cscuniverse.com 인증서에 staging.cscuniverse.com SAN 포함(동일 인증서).
#   - 접근제한: prod 와 동일 allowlist(사무실만).
#   - upstream 은 런타임 resolver 로 해석 → staging 스택이 내려가도 prod 서빙(nginx)은 영향 없음(502만).

# HTTP(80): ACME 검증 + HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name staging.cscuniverse.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443): staging 서비스
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.cscuniverse.com;

    ssl_certificate     /etc/letsencrypt/live/cscuniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cscuniverse.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 접근(access): 사무실 공인 IP 전용(RESTRICTED) staging 은 테스트 환경이라 공개하지 않는다.
    #   공개하려면 아래 include 를 주석 처리(한 줄 토글). prod groupware 는 공개(cscuniverse.conf 참고).
    include /etc/nginx/snippets/cscuniverse-allow.conf;

    client_max_body_size 10m;

    # 파일 업로드/다운로드 (staging file-upload): server 블록 IP allowlist 상속
    location = /blob {
        limit_req zone=upload_limit burst=20 nodelay;   # 업로드 남용/DoS 방어(서명 업로드토큰과 이중)
        # 스토리지 화면 상한(200MB)보다 크게. prod 와 같은 값으로 맞춘다.
        client_max_body_size 210m;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $staging_fileupload csc-staging-api-file-service:8000;
        proxy_pass http://$staging_fileupload;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /files/ {
        proxy_buffering off;   # 대용량 영상 스트리밍, Range(206) 즉시 전달
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $staging_fileupload csc-staging-api-file-service:8000;
        proxy_pass http://$staging_fileupload;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 스토리지 파일 읽기 (web BFF 경유): prod 와 동형
    #   staging 은 IP allowlist 로 이미 좁지만, 설정이 갈리면 prod 에서만 나는 사고가 생긴다.
    location /f/ {
        limit_req zone=file_limit burst=120 nodelay;
        proxy_buffering off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $staging_public_file csc-staging-web-groupware:3000;
        proxy_pass http://$staging_public_file;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /api/storage/ {
        limit_req zone=file_limit burst=120 nodelay;
        proxy_buffering off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $staging_storage csc-staging-web-groupware:3000;
        proxy_pass http://$staging_storage;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # 로그인/인증(BFF /api/auth/*): 브루트포스/크리덴셜 스터핑 방어(레이트리밋). prod 와 동형(공개 시 대비).
    location /api/auth/ {
        limit_req zone=auth_limit burst=60 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $staging_auth_upstream csc-staging-web-groupware:3000;
        proxy_pass http://$staging_auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # AI 생성(기획안 텍스트 / 씬 이미지): 유일하게 느린 경로라 여기만 길게 허용한다.
    #   근거는 prod(cscuniverse.conf) 의 같은 블록 주석 참고. 요약: nginx 기본 60s 는 논스트리밍 기획안
    #   생성(실측 118s)과 공유 ComfyUI 큐 대기를 견디지 못한다. 사다리: 여기(360s) >
    #   csc-marketing(300s) > language-model(240s). 나머지 경로는 기본 60s 유지.
    location /api/marketing/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $staging_ai_upstream csc-staging-web-groupware:3000;
        proxy_pass http://$staging_ai_upstream;
        proxy_http_version 1.1;

        proxy_read_timeout 360s;
        proxy_send_timeout 360s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        # 도커 임베디드 DNS 로 런타임 해석(변수 사용) → 시작 시 staging 컨테이너 의존 X.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $staging_upstream csc-staging-web-groupware:3000;
        proxy_pass http://$staging_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# staging-admin.cscuniverse.com: staging 플랫폼 관리자(control-tower)
#   - prod nginx 가 staging 네트워크로 csc-staging-web-control-tower 에 프록시. 동일 인증서/allowlist.
server {
    listen 80;
    listen [::]:80;
    server_name staging-admin.cscuniverse.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging-admin.cscuniverse.com;

    ssl_certificate     /etc/letsencrypt/live/cscuniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cscuniverse.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 접근(access): 사무실 공인 IP 전용(RESTRICTED) 관리자 패널이라 공개하지 않는다.
    #   공개하려면 아래 include 를 주석 처리(한 줄 토글).
    include /etc/nginx/snippets/cscuniverse-allow.conf;

    client_max_body_size 10m;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $staging_controltower csc-staging-web-control-tower:3000;
        proxy_pass http://$staging_controltower;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# staging-api-docs.cscuniverse.com: staging 통합 API 문서 포털(scalar-gateway)
#   - prod nginx 가 staging 네트워크로 csc-staging-scalar-gateway 에 프록시. 동일 인증서(SAN 추가 필요)/allowlist.
#   - 보호: IP allowlist + scalar-gateway 앱 레벨 BasicAuth(SWAGGER_USER/PASSWORD) 이중.
server {
    listen 80;
    listen [::]:80;
    server_name staging-api-docs.cscuniverse.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging-api-docs.cscuniverse.com;

    ssl_certificate     /etc/letsencrypt/live/cscuniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cscuniverse.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 접근(access): 사무실 공인 IP 전용(RESTRICTED) API 문서 포털(IP + BasicAuth 이중). 공개하지 않는다.
    #   공개하려면 아래 include 를 주석 처리(한 줄 토글).
    include /etc/nginx/snippets/cscuniverse-allow.conf;

    client_max_body_size 10m;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $staging_apidocs csc-staging-scalar-gateway:3000;
        proxy_pass http://$staging_apidocs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
