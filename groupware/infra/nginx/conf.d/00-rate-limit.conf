# 레이트리밋 존 (http 컨텍스트)
# conf.d/*.conf 는 nginx 기본 nginx.conf 의 http{} 안에 include 되므로 여기서 zone 을 정의한다.
# 파일명 00- 접두사 → vhost conf(cscuniverse/staging) 보다 먼저 로드되어, 그쪽 location 의
# limit_req 가 이 zone 을 참조할 수 있다(zone 은 사용처보다 먼저 정의되어야 함).
#
# 목적: apex(cscuniverse.com) 공개(IP allowlist 해제) 이후의 네트워크 레벨 남용 방어.
#   self-hosted nginx(앞단 프록시 없음)라 $binary_remote_addr = 실제 클라이언트 IP.
#   공유 IP(사내 NAT/모바일 캐리어)를 고려해 rate 는 사람 기준 넉넉히 두고 burst 로 순간 파도를 흡수하되,
#   자동화 공격(브루트포스/크리덴셜 스터핑/플러딩)엔 상한을 둔다. 앱 레벨 계정 잠금과 이중 방어.
#   일반 페이지/정적 에셋에는 적용하지 않는다(정상 사용자 영향 0): 민감 경로(로그인/업로드)만 제한.

limit_req_status 429;   # 초과 시 503(기본) 대신 429 Too Many Requests

# 로그인/인증(/api/auth/*): 브루트포스, 크리덴셜 스터핑 방어. burst 60 흡수 + 30r/m 지속.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

# 업로드(PUT /blob): 서명 업로드토큰이 1차 게이트이나 남용/DoS 방어로 추가. burst 20 흡수 + 120r/m 지속.
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=120r/m;

# 스토리지 파일 읽기(/f/ 공개 + /api/storage/ 세션): 바이트를 내주는 경로라 남용 비용이 크다.
#   /f/ 는 로그인 없이 열리는 유일한 경로이고, /api/storage/ 는 세션이 1차 게이트다(도난 세션과
#   폭주하는 클라이언트에 대한 상한). 한 화면이 이미지를 여러 장 부르고 영상 시킹이 Range 요청을
#   여러 번 내므로 burst 를 넉넉히 두고 지속 속도로 자동화를 막는다.
limit_req_zone $binary_remote_addr zone=file_limit:10m rate=600r/m;
