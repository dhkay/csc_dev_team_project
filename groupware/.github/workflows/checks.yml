name: checks

# 코드 품질 게이트. PR 과 dev/staging/main push 마다 실행한다.
# 배포 워크플로(deploy-*.yml)는 staging/main push 시에만 도므로 PR 단계를 막으려면 이것이 따로 있어야 한다.
#
# 러너
# self-hosted(`web-server`)에서 돈다. GitHub-hosted 는 잡마다 1분 단위로 올려 청구해 10초짜리 검사도
# 1분을 먹고, 사용량 한도에 걸리면 코드와 무관하게 전 잡이 "not started" 로 죽는다. self-hosted 는
# 분 계산이 없다. 배포 잡과 라벨은 같지만 concurrency 그룹이 달라 서로를 취소하지 않는다.
#
# 러너 호스트에 있어야 하는 것
# CI 는 호스트를 바꾸지 않는다(운영 호스트라 패키지 구성을 CI 가 흔들면 안 된다). 없으면 그 잡이
# 이유를 적어 실패하고, 사람이 한 번 설치한다.
#   docker            서비스 컨테이너 + 일회성 psql 클라이언트
#   ffmpeg            video-model 렌더 테스트
#   build-essential   rusqlite(bundled)가 SQLite 를 C 로 함께 빌드한다
#   git               checkout
# node/uv 는 setup 액션이 받아서 캐시하고, pnpm 은 그 node 에 딸려 오는 corepack 이 받는다
# (호스트 설치 불필요). rust 는 rustup 이 선탑재된 GitHub-hosted 이미지를 전제하는 액션이라 그
# 잡이 직접 부트스트랩한다(rust 잡 주석 참고).
#
# 러너를 추가로 등록해도 위 목록만 있으면 된다. 툴체인을 러너별로 손으로 맞추면 새 러너에서만
# 깨지고, 그 실패는 그 러너에 잡이 배정될 때까지 보이지 않는다.
#
# 잡 구성
# 툴체인 하나에 잡 하나. 러너가 한 대라 잡이 늘면 checkout 과 setup 이 그만큼 반복되고 그게
# 그대로 대기 시간이 된다. alembic 만 python 과 툴체인이 같은데도 갈라져 있다: postgres 서비스
# 컨테이너가 잡 단위로 붙기 때문이다.
#
# 그리고 바뀐 것만 검사한다(paths-filter, 배포 워크플로와 같은 패턴). 러너가 한 대라 잡이 순차로
# 도니, 마케팅 TS 한 줄 때문에 Rust 와 Python 이 도는 것이 그대로 대기 시간이다.
# 단 `contracts` 는 항상 돈다: 그 게이트들은 앱 경계를 넘는 계약을 보므로 어느 변경과도 무관하지 않다.
on:
  pull_request: {}
  push:
    branches: [dev, staging, main]
  workflow_dispatch: {}

permissions:
  contents: read
  # paths-filter 는 PR 에서 변경 파일 목록을 GitHub API(/pulls/{n}/files)로 가져온다.
  #   이 권한이 없으면 `Resource not accessible by integration` 으로 죽는다. push 트리거는
  #   git 비교를 쓰므로 걸리지 않아, PR 을 열 때만 드러난다.
  pull-requests: read

# 같은 참조(브랜치/PR)의 앞선 런은 취소한다. 러너가 한정돼 있어 낡은 런이 계속 돌면 최신 커밋의
# 검사가 그 뒤에서 대기한다. 최신 커밋의 결과만 의미가 있으므로 취소해도 잃는 것이 없다.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 어떤 언어 영역이 바뀌었는지 판별. 아래 언어별 잡이 이 결과로 갈린다.
  #
  # 필터는 넓게 잡는다. 좁게 잡아 빠뜨리면 검사가 조용히 건너뛰어지고 그 사실이 초록으로 보인다
  # (실패보다 나쁘다). 그래서 각 필터에 워크스페이스 루트와 락파일, 이 워크플로 자신을 함께 넣어
  # 인프라 변경에는 전부 돌게 한다.
  changes:
    name: 변경 영역 판별
    runs-on: [self-hosted, web-server]
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common: &common
              - '.github/workflows/checks.yml'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            ts:
              - *common
              - 'apps/web/**'
              - 'apps/api/nestjs/**'
              - 'apps/tools/**'
              - 'packages/**'
            rust:
              - *common
              - 'apps/desktop/**'
              # mes-contracts 의 골든 테스트가 이 픽스처를 `include_str!` 로 읽는다(TS 측과 같은
              #   JSON 을 두 언어가 읽어 계약을 잠근다). 경로가 apps/ 밖이라 위 항목에 걸리지
              #   않는다. 빠뜨리면 픽스처만 고친 PR 에서 Rust 미러 검사가 건너뛰어지고 그 사실이
              #   초록으로 보인다.
              - 'packages/mes-contracts/**'
            # alembic 잡도 이 필터를 쓴다. `models.py` 만 보도록 좁히려 했지만 그 가정이 틀렸다:
            #   language-model 은 DeclarativeBase 를 `app/shared/.../db/base.py` 에 둔다. 좁은 필터는
            #   그 변경을 놓치고, 놓친 드리프트 검사는 초록으로 보인다(실패보다 나쁘다).
            #   46초를 아끼려고 그 위험을 지지 않는다.
            python:
              - *common
              - 'apps/api/fastapi/**'

  # 계약/무결성 게이트. 전부 zero-dep 노드 스크립트라 설치가 없다.
  # 필터를 걸지 않는다: 이 게이트들은 앱 경계를 넘는 계약(엔드포인트 식별자, 로그/MES 미러,
  # BFF 라우트, 버전 축, 단가 커버리지, 포털 배선)을 보므로 어느 변경과도 무관하지 않다.
  #
  # 게이트 목록을 여기 적지 않는다. `check-all` 이 `scripts/check-*.mjs` 를 디스크에서 찾아 전부
  # 돌리므로 새 게이트는 파일을 두는 것만으로 CI 와 `pnpm lint` 양쪽에 들어온다. 손으로 두 곳에
  # 적던 시절에 실제로 갈라졌다(lint 4개 vs CI 7개).
  contracts:
    name: 계약/무결성 게이트
    runs-on: [self-hosted, web-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-all.mjs

  # TypeScript 전 패키지: 타입체크 + 단위 테스트. NestJS 앱들의 Jest 스위트도 여기서 함께 돈다.
  #
  # turbo 로 돌려야 한다: 워크스페이스 패키지는 dist(.d.ts)로 참조되므로 의존 패키지를 먼저 빌드해야
  # 타입이 해석된다(turbo.json 의 typecheck/test 가 dependsOn ^build 로 그 순서를 보장한다).
  # 필터를 걸지 않는다: 해당 스크립트를 가진 패키지 전부가 대상이어야 신규 패키지가 자동으로 들어온다
  # (한 패키지만 돌리면 새 공유 커널의 테스트가 CI 밖에 남는다).
  typescript:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    name: TypeScript (타입체크 / 단위 테스트)
    runs-on: [self-hosted, web-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # pnpm 은 corepack 으로 받는다. `pnpm/action-setup` 은 자기 설치 경로를 PATH 에 얹어 주는데,
      #   러너에 따라 그 경로가 다음 스텝까지 오지 않아 `pnpm: command not found` 로 죽었다
      #   (동시성용으로 러너를 추가할 때마다 다시 겪는다. rustup 과 같은 종류의 문제다).
      #   corepack 은 setup-node 가 받은 node 에 딸려 오고 shim 을 그 node 의 bin 에 두므로,
      #   이미 동작이 확인된 PATH 하나에만 의존한다. 버전은 루트 package.json 의 packageManager 가
      #   정하므로 로컬과 같은 pnpm 이 깔린다(액션 입력으로 버전을 또 적지 않는다).
      #   `pnpm --version` 을 함께 두는 이유: 실패하면 "pnpm 준비" 스텝이 이름으로 원인을 말한다.
      - name: pnpm 준비
        run: |
          corepack enable pnpm
          pnpm --version
      # setup-node 의 `cache: pnpm` 을 쓰지 않는다. self-hosted 는 호스트에 pnpm 스토어가 그대로
      #   남아 다음 런이 그것을 그대로 쓰므로, 캐시 아카이브를 올리고 내리는 값이 순이득이 아니다.
      #   (GitHub-hosted 는 매번 새 머신이라 사정이 다르다. release-desktop.yml 은 그쪽이라 유지.)
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm turbo run typecheck
      - name: test
        run: pnpm turbo run test

  # 데스크톱(현장 PC) Rust 크레이트: 포맷 / 린트 / 단위 테스트.
  #
  # 리눅스에서 도는 이유: 여기서 검사하는 crate(mes-contracts / mes-core / mes-store / mes-sync)는
  # Tauri 에 의존하지 않아 리눅스에서 그대로 빌드된다. 앱 crate(mes-app)와 번들링은 Windows 러너로
  # 5분에서 15분이 걸려 PR 게이트에 넣을 수 없다(release-desktop.yml 이 태그 push 에서 담당).
  #
  # 컨테이너로 돌리지 않는다. self-hosted 러너는 저장소별로 워크스페이스 한 디렉터리를 모든 잡이
  # 공유하고, 컨테이너 잡은 그 안에서 root 로 돌아 파일 소유자를 root 로 만든다. 그러면 다음 잡이
  # 청소하지 못해 checkout 이 EACCES 로 죽는다. 한 잡이 나머지 전부와 배포까지 망가뜨렸다.
  #
  # clippy 를 -D warnings 로 잠그는 이유: Rust 선례가 0건인 팀이라 스타일 논쟁이 리뷰로 새어나오기
  # 전에 기계가 정하게 한다.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust (데스크톱 크레이트)
    runs-on: [self-hosted, web-server]
    defaults:
      run:
        working-directory: apps/desktop/mes/src-tauri
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted 이미지에는 rustup 이 선탑재라 대부분의 워크플로가 이 단계를 생략한다.
      #   self-hosted 러너에는 없어서 다음 액션이 `rustup: command not found` 로 죽는다. 호스트에
      #   손으로 깔아 두면 러너를 새로 등록할 때 또 빠뜨리므로, 필요를 워크플로가 직접 선언한다.
      #   toolchain 은 none 으로 받고 실제 설치는 다음 액션에 맡긴다(같은 것을 두 번 받지 않게).
      - name: rustup 준비
        run: |
          # `command -v` 만으로 판정하면 안 된다. 러너가 잡에 넘기는 PATH(.path)에 `~/.cargo/bin` 이
          #   없어서, 이미 설치돼 있어도 없는 것으로 보이고 재설치를 시도한다. rustup-init 은 기존
          #   설치 위에서 오류로 죽으므로 그대로면 잡이 항상 실패한다. 설치 위치를 직접 본다.
          if ! command -v rustup > /dev/null && ! [ -x "$HOME/.cargo/bin/rustup" ]; then
            init="${RUNNER_TEMP:-/tmp}/rustup-init.sh"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$init"
            sh "$init" -y --profile minimal --default-toolchain none --no-modify-path
            rm -f "$init"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # 레포 루트에 Cargo.toml 이 없다. 워크스페이스 경로를 명시하지 않으면 캐시가 비활성된다.
          workspaces: apps/desktop/mes/src-tauri
      # 세 단계 모두 앞 단계 실패와 무관하게 돈다. fmt 에서 멈추면 포맷 한 줄 고쳐 push 하고 그제서야
      #   다음 실패를 보는 왕복이 반복된다. 각 단계는 독립적으로 실패하므로 게이트는 그대로다.
      - name: fmt
        id: fmt
        run: cargo fmt --all --check
      # 라이브러리 crate 만 대상으로 한다. mes-app 은 tauri 시스템 의존(webkit2gtk 등)이 필요하고,
      #   그 apt 설치를 PR 게이트에 넣을 이유가 없다.
      - name: clippy
        if: always() && steps.fmt.outcome != 'cancelled'
        run: cargo clippy -p mes-contracts -p mes-core -p mes-store -p mes-sync -- -D warnings
      - name: test
        if: always() && steps.fmt.outcome != 'cancelled'
        run: cargo test -p mes-contracts -p mes-core -p mes-store -p mes-sync

  # Python: 공유 커널 + FastAPI 앱 전부.
  #
  # 공유 커널(csc-net-utils = 서비스토큰/상관관계 전파)은 TS 측과 한 계약을 두 벌로 구현하므로 양쪽을
  # 모두 잠근다. 이름 일치는 위 게이트(check-log-contracts)가, 동작은 여기가 본다.
  # 앱 스위트에는 돈과 인가가 걸린 로직(청구 단위 계산, 로그 적재/조회, 업로드 서명)이 있다.
  #
  # 앱마다 스텝을 두는 이유: 어느 앱이 깨졌는지 잡 화면에서 바로 보인다. 경로가 앱마다 다른 것은
  # 테스트를 둔 자리가 달라서다(tests/ 또는 도메인 안 또는 앱 루트).
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python (공유 커널 / FastAPI 앱)
    runs-on: [self-hosted, web-server]
    defaults:
      run:
        working-directory: apps/api/fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # CI 는 호스트를 바꾸지 않는다. 없으면 이유를 적어 실패한다(video-model 의 compose 테스트가
      #   실제 렌더로 청구 초 누적을 검증하고, ffmpeg 가 없으면 그 테스트들이 조용히 skip 된다).
      - name: ffmpeg 확인
        run: |
          command -v ffmpeg >/dev/null || {
            echo "러너 호스트에 ffmpeg 가 없습니다. 한 번 설치하세요: sudo apt-get install -y ffmpeg"
            exit 1
          }
      - name: 공유 커널
        run: uv run --package csc-net-utils pytest net-utils/tests -q
      - name: video-model
        run: uv run --package video-model pytest video-model/tests -q
      - name: log-server
        run: uv run --package log-server pytest log-server/tests -q
      # 패키지 전체를 준다. `file-upload/tests` 만 주면 도메인 안(app/domains/*/tests)의 테스트가
      #   빠지는데, 스토리지 인가 경계(영역/부서 스코프, 조직 격리)를 지키는 테스트가 전부 거기
      #   있다. 실제로 그 경로만 돌 때 2개, 패키지 전체로는 75개가 돈다.
      - name: file-upload
        run: uv run --package file-upload pytest file-upload -q
      # 모델 신원(응답 model = served 이름) 회귀 테스트가 도메인 안에 있다. 깨지면 호출자의 비용이
      #   조용히 rate-unknown 으로 샌다.
      - name: language-model
        run: uv run --package language-model pytest language-model/app -q
      # /lab 마운트와 문서 분리는 깨져도 예외가 아니라 "포털 탭이 빈다" 로만 드러나 CI 가 유일한 감시자다.
      - name: data-collector
        run: uv run --package data-collector pytest data-collector -q

  # SQLAlchemy 모델과 Alembic 리비전의 정합성.
  #
  # 막는 실수: models.py 에 컬럼을 더하고 `alembic revision` 을 잊는 것. CI 가 통과하고, 배포된
  # 컨테이너의 `alembic upgrade head` 는 적용할 것이 없어 조용히 성공한 뒤, 런타임 첫 질의에서
  # UndefinedColumnError 로 터진다. Drizzle 쪽의 "generate 후 No schema changes" 와 같은 역할이다.
  #
  # 방법: 빈 DB 에 리비전을 전부 올리고(`upgrade head`) 모델과 비교한다(`check`).
  alembic:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Alembic 리비전 ↔ 모델 정합성
    runs-on: [self-hosted, web-server]
    defaults:
      run:
        working-directory: apps/api/fastapi
    # 호스트 포트를 고정하지 않는다. 컨테이너 포트만 적으면 Docker 가 빈 포트를 골라 주고 그 번호를
    #   `job.services.postgres.ports` 로 읽는다. 고정하면 그 호스트에 postgres 가 생길 때, 그리고
    #   러너가 둘 이상이라 다른 브랜치의 이 잡이 동시에 뜰 때 바인딩이 충돌한다.
    #   (self-hosted 잡은 호스트에서 직접 실행되므로 서비스명으로는 닿을 수 없고 호스트 포트만 쓴다.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # 앱과 DB 이름의 짝을 한 곳에만 둔다. 생성과 검사를 따로 나열하면 그 목록이 갈린다.
      #   DB 이름은 각 앱 config 의 database_url 기본값과 맞춘다(앱마다 자기 DB 를 소유한다).
      #
      # 호스트의 psql 을 쓰지 않는다: 서비스 컨테이너에 이미 Docker 가 필요하므로 같은 이미지를
      #   일회성 클라이언트로 써서 호스트에 무엇이 깔렸는지에 의존하지 않는다.
      #
      # 첫 실패에서 멈추지 않는다. 드리프트가 여러 앱에 있으면 한 번에 보는 편이 왕복을 줄인다.
      - name: 앱별 리비전 적용과 모델 비교
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          # 앱과 DB 이름의 짝. 이 목록이 유일한 출처다.
          apps="video-model:videomodeldb file-upload:file_upload language-model:languagemodeldb data-collector:crawler"
          failed=""
          for pair in $apps; do
            app="${pair%%:*}"
            db="${pair##*:}"
            echo "==== $app ($db)"
            docker run --rm --network host -e PGPASSWORD=postgres postgres:16 psql -h localhost -p "$PGPORT" -U postgres -c "CREATE DATABASE $db"
            url="postgresql+asyncpg://postgres:postgres@localhost:$PGPORT/$db"
            ( cd "$app" &&
              DATABASE_URL="$url" uv run alembic upgrade head &&
              DATABASE_URL="$url" uv run alembic check ) || failed="$failed $app"
          done
          if [ -n "$failed" ]; then
            echo "리비전과 모델이 어긋난 앱:$failed"
            exit 1
          fi
          echo "$(echo $apps | wc -w)개 앱 모두 정합"