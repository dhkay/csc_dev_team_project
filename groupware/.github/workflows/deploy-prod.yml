          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Provision .env from secrets
        if: steps.gate.outputs.deploy == 'true'
        env:
          SERVICE_TOKEN_SECRET: ${{ secrets.PROD_SERVICE_TOKEN_SECRET }}
          REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
        run: bash "$REPO_DIR/scripts/deploy/write-secret-env.sh" "$REPO_DIR/infra/docker/prod/ai/.env"

      - name: Deploy (build + up)
        if: steps.gate.outputs.deploy == 'true'
        run: bash "$REPO_DIR/scripts/deploy/deploy.sh" "$REPO_DIR/infra/docker/prod/ai/docker-compose.yml"

      # 마커 전진. `if` 를 두지 않는다: 앞 스텝이 모두 성공했을 때만 도달하므로 배포 성공과 건너뜀
      #   두 경우에만 전진하고, 배포가 실패하면 옛 커밋이 남아 다음 push 가 자동으로 재시도한다.
      - name: 배포 상태 기록
        run: |
          git -C "$REPO_DIR" rev-parse HEAD > "${{ steps.state.outputs.marker }}"
          echo "배포 상태 기록: $(cat "${{ steps.state.outputs.marker }}")"
