name: Deploy to prod

# main 브랜치에 머지(push)되면 prod 환경에 반영.
#   - apps/api/fastapi/video-model  → video-ai-server(video-model-worker) + web-server(api-video-model)
#   - 그 외 모든 앱(web/nestjs/file-upload 등)  → web-server (라벨: self-hosted + web-server)
# staging 과 동일한 머신 러너를 재사용하되, prod 는 별도 클론(~/Projects/csc_project/prod),
# 별도 compose 프로젝트(csc-prod-*), 별도 포트로 격리된다.
#
# 초기 단계라 main 머지 시 staging 과 동일하게 자동 배포한다(승인 게이트 없음).
#   → 나중에 수동 승인을 켜려면 각 배포 잡에 `environment: production` 을 추가하고,
#     저장소 Settings → Environments → production 에 Required reviewers 를 지정한다.
# 비밀은 GitHub Secrets 로 관리 → 배포 직전 write-secret-env.sh 가 서버 .env 에 주입(키 단위 upsert).
#   필요 Secrets: PROD_SERVICE_TOKEN_SECRET(web/ai 공통), PROD_REDIS_PASSWORD(web/ai 공통),
#                 PROD_JWT_SECRET, PROD_JWT_REFRESH_SECRET, PROD_PLATFORM_ROOT_PASSWORD
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # 1) web-server 배포 (video-model 제외 전체).
  deploy-web:
    runs-on: [self-hosted, web-server]
    concurrency:
      group: deploy-prod-web
      cancel-in-progress: false
    steps:
      - name: Sync prod clone to origin/main
        env:
          PROD_REPO_DIR: ${{ secrets.PROD_REPO_DIR }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_DIR="${PROD_REPO_DIR:-$HOME/Projects/csc_project/prod}"
          if [ ! -d "$REPO_DIR/.git" ]; then
            echo "ERROR: $REPO_DIR 에 git 클론이 없음. 최초 1회 수동 클론 필요." >&2
            exit 1
          fi
          cd "$REPO_DIR"
          AUTH="Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$AUTH" fetch --prune origin
          git checkout main
          git reset --hard origin/main
          echo "배포 커밋 $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"
          echo "REPO_DIR=$REPO_DIR" >> "$GITHUB_ENV"

      # 배포 판정의 기준점. paths-filter 의 기본 기준은 "이번 push 의 직전 커밋" 인데, 그러면 배포가
      #   실패한 뒤 관계없는 push 가 오면 건너뛰어져 배포되지 않은 상태가 초록으로 보인 채 남는다
      #   (staging 이 실제로 나흘간 그 상태였다). 기준을 "마지막으로 성공한 배포 커밋" 으로 바꾸면
      #   실패한 변경이 diff 에 계속 남아 다음 push 에서 자동으로 재시도된다.
      #   마커는 이 잡이 도는 호스트에만 있으므로 판정도 이 잡 안에서 한다.
      - name: 마지막 성공 배포 커밋 읽기
        id: state
        run: |
          set -euo pipefail
          STATE="$HOME/.csc-deploy-state"
          mkdir -p "$STATE"
          MARKER="$STATE/prod-web.sha"
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"
          BASE="$(cat "$MARKER" 2>/dev/null || true)"
          if [ -n "$BASE" ] && git -C "$REPO_DIR" cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "마지막 성공 배포: $BASE"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "성공 기록이 없거나 그 커밋이 사라졌다. 경로 비교를 건너뛰고 배포한다."
          fi

      # 기준이 있을 때만 경로를 비교한다. 없으면 어차피 배포하므로 체크아웃 비용도 들이지 않는다.
      - uses: actions/checkout@v4
        if: steps.state.outputs.base != ''
        with:
          ref: main
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        if: steps.state.outputs.base != ''
        id: filter
        with:
          base: ${{ steps.state.outputs.base }}
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/tools/**'                          # scalar-gateway(통합 API 문서 포털)
              - 'apps/api/nestjs/**'
              - 'apps/api/fastapi/file-upload/**'
              - 'apps/api/fastapi/video-model/**'   # web 스택이 api-video-model 를 이 코드로 빌드
              - 'apps/api/fastapi/log-server/**'         # 통합 로그(수집/조회 + 컨슈머)
              - 'apps/api/fastapi/data-collector/**'     # 데이터 수집 API + 워커
              - 'apps/api/fastapi/language-model/**'     # 챗봇/기획 LLM (web 스택에서 빌드)
              - 'apps/api/fastapi/net-utils/**'         # 공유 패키지(csc-net-utils)
              - 'apps/api/fastapi/log-contracts/**'     # 공유 패키지(csc-log-contracts)
              - 'apps/api/fastapi/pyproject.toml'       # uv 워크스페이스 루트
              - 'apps/api/fastapi/uv.lock'
              - 'packages/**'
              - 'infra/docker/base/**'
              - 'infra/docker/prod/web/**'
              - 'infra/nginx/**'
              - 'scripts/deploy/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'

      - name: 배포 필요 판정
        id: gate
        env:
          CHANGED: ${{ steps.filter.outputs.web }}
          NOBASE: ${{ steps.state.outputs.base == '' }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH" = "true" ]; then
            reason="수동 실행"
          elif [ "$NOBASE" = "true" ]; then
            reason="성공 배포 기록 없음"
          elif [ "$CHANGED" = "true" ]; then
            reason="마지막 성공 배포 이후 관련 경로 변경"
          else
            echo "건너뜀: 마지막 성공 배포 이후 관련 경로에 변경 없음"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "배포: $reason"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Provision .env from secrets
        if: steps.gate.outputs.deploy == 'true'
        env:
          SERVICE_TOKEN_SECRET: ${{ secrets.PROD_SERVICE_TOKEN_SECRET }}
          REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          # 로그 저장소(ClickHouse) 접속 비밀번호: prod compose 는 필수(:?)라 미설정이면 compose 해석
          # 단계에서 배포 전체가 중단된다. 미설정이면 빈 값 → 주입 건너뜀 → 서버 .env 수동 값 보존.
          CLICKHOUSE_PASSWORD: ${{ secrets.PROD_CLICKHOUSE_PASSWORD }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.PROD_JWT_REFRESH_SECRET }}
          PLATFORM_ROOT_PASSWORD: ${{ secrets.PROD_PLATFORM_ROOT_PASSWORD }}
          # 통합 문서 포털 BasicAuth(선택). 미설정이면 빈 값 → 주입 건너뜀 → 포털은 nginx IP allowlist 로만 보호.
          SWAGGER_USER: ${{ secrets.PROD_SWAGGER_USER }}
          SWAGGER_PASSWORD: ${{ secrets.PROD_SWAGGER_PASSWORD }}
          # 조직/마케팅 자격증명 at-rest 암호화 키(AES-256-GCM). 미설정이면 빈 값 → 주입 건너뜀 →
          # 서버 .env 의 수동 값이 보존된다. 한 번 정하면 고정할 것(바뀌면 기존 암호문 복호화 불가).
          GROUPWARE_SECRET_ENC_KEY: ${{ secrets.PROD_GROUPWARE_SECRET_ENC_KEY }}
        run: bash "$REPO_DIR/scripts/deploy/write-secret-env.sh" "$REPO_DIR/infra/docker/prod/web/.env"

      - name: Deploy (build + up)
        if: steps.gate.outputs.deploy == 'true'
        run: bash "$REPO_DIR/scripts/deploy/deploy.sh" "$REPO_DIR/infra/docker/prod/web/docker-compose.yml"

      # 마커 전진. `if` 를 두지 않는다: 앞 스텝이 모두 성공했을 때만 도달하므로 배포 성공과 건너뜀
      #   두 경우에만 전진하고, 배포가 실패하면 옛 커밋이 남아 다음 push 가 자동으로 재시도한다.
      - name: 배포 상태 기록
        run: |
          git -C "$REPO_DIR" rev-parse HEAD > "${{ steps.state.outputs.marker }}"
          echo "배포 상태 기록: $(cat "${{ steps.state.outputs.marker }}")"

  # 2) video-ai-server 배포 (video-model 만).
  deploy-ai:
    runs-on: [self-hosted, video-ai-server]
    concurrency:
      group: deploy-prod-ai
      cancel-in-progress: false
    steps:
      - name: Sync prod clone to origin/main
        env:
          PROD_REPO_DIR: ${{ secrets.PROD_REPO_DIR }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_DIR="${PROD_REPO_DIR:-$HOME/Projects/csc_project/prod}"
          if [ ! -d "$REPO_DIR/.git" ]; then
            echo "ERROR: $REPO_DIR 에 git 클론이 없음. 최초 1회 수동 클론 필요." >&2
            exit 1
          fi
          cd "$REPO_DIR"
          AUTH="Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$AUTH" fetch --prune origin
          git checkout main
          git reset --hard origin/main
          echo "배포 커밋 $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"
          echo "REPO_DIR=$REPO_DIR" >> "$GITHUB_ENV"

      # 배포 판정의 기준점. paths-filter 의 기본 기준은 "이번 push 의 직전 커밋" 인데, 그러면 배포가
      #   실패한 뒤 관계없는 push 가 오면 건너뛰어져 배포되지 않은 상태가 초록으로 보인 채 남는다
      #   (staging 이 실제로 나흘간 그 상태였다). 기준을 "마지막으로 성공한 배포 커밋" 으로 바꾸면
      #   실패한 변경이 diff 에 계속 남아 다음 push 에서 자동으로 재시도된다.
      #   마커는 이 잡이 도는 호스트에만 있으므로 판정도 이 잡 안에서 한다.
      - name: 마지막 성공 배포 커밋 읽기
        id: state
        run: |
          set -euo pipefail
          STATE="$HOME/.csc-deploy-state"
          mkdir -p "$STATE"
          MARKER="$STATE/prod-ai.sha"
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"
          BASE="$(cat "$MARKER" 2>/dev/null || true)"
          if [ -n "$BASE" ] && git -C "$REPO_DIR" cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "마지막 성공 배포: $BASE"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "성공 기록이 없거나 그 커밋이 사라졌다. 경로 비교를 건너뛰고 배포한다."
          fi

      # 기준이 있을 때만 경로를 비교한다. 없으면 어차피 배포하므로 체크아웃 비용도 들이지 않는다.
      - uses: actions/checkout@v4
        if: steps.state.outputs.base != ''
        with:
          ref: main
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        if: steps.state.outputs.base != ''
        id: filter
        with:
          base: ${{ steps.state.outputs.base }}
          filters: |
            ai:
              - 'apps/api/fastapi/video-model/**'
              - 'apps/api/fastapi/net-utils/**'        # 공유 패키지(csc-net-utils)
              - 'apps/api/fastapi/log-contracts/**'    # 공유 패키지(csc-log-contracts)
              - 'apps/api/fastapi/pyproject.toml'      # uv 워크스페이스 루트
              - 'apps/api/fastapi/uv.lock'
              - 'infra/docker/base/python.Dockerfile'
              - 'infra/docker/comfyui/**'
              - 'infra/docker/prod/ai/**'
              - 'scripts/deploy/**'

      - name: 배포 필요 판정
        id: gate
        env:
          CHANGED: ${{ steps.filter.outputs.ai }}
          NOBASE: ${{ steps.state.outputs.base == '' }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH" = "true" ]; then
            reason="수동 실행"
          elif [ "$NOBASE" = "true" ]; then
            reason="성공 배포 기록 없음"
          elif [ "$CHANGED" = "true" ]; then
            reason="마지막 성공 배포 이후 관련 경로 변경"
          else
