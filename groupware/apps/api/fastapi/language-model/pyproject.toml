[project]
name = "language-model"
version = "0.0.0"
description = "재사용 가능한 LLM 역량 API: FastAPI 헥사고날 (Qwen3 추론/챗봇 세션/RAG, uv 관리)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",          # OpenAI 호환 추론 엔진(vLLM/Ollama) 호출 + 스트리밍
    "sse-starlette>=2.1",   # SSE(EventSourceResponse): 토큰 스트리밍, 연결 끊김 시 취소
    "arq>=0.26",            # RAG 인제스트/임베딩 워커(Phase 2)
    "csc-net-utils[http]",  # 서버 간 토큰/미들웨어/HTTP 클라이언트 공유 (워크스페이스)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
csc-net-utils = { workspace = true }

# uv 로 관리: `uv add <pkg>` / `uv sync` / `uv run uvicorn app.main:app --reload`
# 락파일(uv.lock)은 워크스페이스 루트(apps/api/fastapi/uv.lock) 하나로 공유된다.

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 앱 소스는 __init__.py 없이 PEP 420 네임스페이스 패키지로 둔다(빈 마커 제거). pytest 가 이를 인식하고
# full-path 로 import 하도록 아래 3줄이 필요하다. pythonpath="." 로 app 을 네임스페이스 패키지로 import.
consider_namespace_packages = true
addopts = "--import-mode=importlib"
pythonpath = ["."]
