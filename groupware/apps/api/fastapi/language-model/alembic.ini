# Alembic config. Keep this file ASCII-only: on Windows it is read with the
# system locale (cp949), so non-ASCII bytes raise UnicodeDecodeError.
# Connection URL is overridden by env DATABASE_URL in alembic/env.py.
# Usage: uv run alembic revision --autogenerate ; uv run alembic upgrade head
[alembic]
script_location = alembic
# Make the app package importable (env.py imports app.domains...models).
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://localhost:5432/languagemodeldb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
