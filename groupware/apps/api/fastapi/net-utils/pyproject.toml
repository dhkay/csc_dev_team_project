[project]
name = "csc-net-utils"
version = "0.0.0"
description = "csc 서버 간 HTTP 통신 공유 유틸 (서비스 토큰 발급/검증, 미들웨어, HTTP 클라이언트)."
requires-python = ">=3.12"
# 미들웨어/컨텍스트는 starlette(ASGI) 기반, 토큰은 표준 라이브러리만 사용.
# fastapi 는 `identity.py` 의 의존성 함수(Header/Depends)에 필요하다. 소비자가 전부 FastAPI 앱이라
# 옵션 익스트라로 숨기지 않고 명시한다(import 하는데 선언 안 하면 설치 조합에 따라 깨진다).
dependencies = ["starlette>=0.37", "fastapi>=0.115"]

# 아웃바운드 HTTP 클라이언트(httpx)는 필요한 앱만 설치하도록 옵션 익스트라로 분리.
#   csc-net-utils[http]  → video-model 처럼 서버 간 호출하는 앱
[project.optional-dependencies]
http = ["httpx>=0.27"]

[dependency-groups]
# 미들웨어/컨텍스트 테스트에 ASGI 앱과 클라이언트가 필요하다.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csc_net_utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
consider_namespace_packages = true
addopts = "--import-mode=importlib"
pythonpath = ["src"]
