# Alembic config (DB migrations). `uv run alembic revision --autogenerate` -> `uv run alembic upgrade head`
[alembic]
script_location = alembic
# Put cwd(.) on sys.path so env.py can import the `app` package.
prepend_sys_path = .
# Connection URL is overridden by env.py from DATABASE_URL (app settings). Below is a local fallback only.
sqlalchemy.url = postgresql+asyncpg://localhost:5432/crawler

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
